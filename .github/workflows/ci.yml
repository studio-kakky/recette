name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同一ブランチで CI が重複実行されないようにする（main は打ち消さない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-node の pnpm キャッシュより先に pnpm を用意する必要がある。
      # バージョンは package.json の packageManager フィールドに従う。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm --filter @recette/web typecheck

      - name: Test
        run: pnpm web:test

      - name: Build web
        run: pnpm web:build

      - name: Build docs
        run: pnpm docs:build
